<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>ZedBoutik — Achète. Vends. Simplement.</title>
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#" onclick="showHome();return false">ZedBoutik</a>
  <div class="top-actions">
    <button class="btn ghost" id="cartBtn">🛒 Panier <span id="cartCount">0</span></button>
    <button class="btn dark" id="accountBtn">👤 Connexion</button>
  </div>
</header>

<main>
  <section class="search-wrap">
    <input id="searchInput" type="search" placeholder="Rechercher un produit…" autocomplete="off">
    <button id="searchBtn" class="search-btn" aria-label="Rechercher">🔎</button>
  </section>

  <section class="hero">
    <p class="eyebrow">Marketplace sénégalaise</p>
    <h1>Achète. Vends.<br>Simplement.</h1>
    <p>Découvre les produits de vendeurs partout au Sénégal.</p>
  </section>

  <section class="section">
    <div class="section-head"><h2>Catégories</h2><button class="link-btn" data-category="">Tout voir</button></div>
    <div class="categories" id="categories">
      <button data-category="Mode">👕 <span>Mode</span></button>
      <button data-category="Électronique">💻 <span>Électronique</span></button>
      <button data-category="Maison">🏠 <span>Maison</span></button>
      <button data-category="Parfums">🌸 <span>Parfums</span></button>
      <button data-category="Alimentation">🛒 <span>Alimentation</span></button>
      <button data-category="Autres">📦 <span>Autres</span></button>
    </div>
  </section>

  <section class="section">
    <div class="section-head"><h2>Produits</h2><span id="productStatus" class="muted"></span></div>
    <div id="products" class="products"></div>
  </section>
</main>

<div class="modal hidden" id="authModal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <button class="close" data-close="authModal">×</button>
    <h2 id="authTitle">Connexion</h2>
    <div class="tabs">
      <button class="tab active" id="loginTab">Connexion</button>
      <button class="tab" id="signupTab">Créer un compte</button>
    </div>
    <form id="authForm">
      <div id="signupFields" class="hidden">
        <label>Nom complet<input id="fullName" autocomplete="name"></label>
        <label>Téléphone<input id="phone" inputmode="tel" autocomplete="tel"></label>
        <label>Type de compte
          <select id="role"><option value="client">Client</option><option value="vendeur">Vendeur</option></select>
        </label>
      </div>
      <label>Email<input id="email" type="email" required autocomplete="email"></label>
      <label>Mot de passe<input id="password" type="password" minlength="6" required autocomplete="current-password"></label>
      <button class="btn primary full" id="authSubmit" type="submit">Se connecter</button>
      <p id="authMessage" class="message"></p>
    </form>
  </div>
</div>

<div class="modal hidden" id="accountModal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <button class="close" data-close="accountModal">×</button>
    <h2>Mon compte</h2>
    <div id="accountInfo"></div>
    <button id="sellerBtn" class="btn primary full hidden">🏪 Espace vendeur</button>
    <button id="logoutBtn" class="btn danger full">Déconnexion</button>
  </div>
</div>

<div class="modal hidden" id="sellerModal" role="dialog" aria-modal="true">
  <div class="modal-card wide">
    <button class="close" data-close="sellerModal">×</button>
    <h2>Espace vendeur</h2>
    <form id="productForm" class="form-grid">
      <label>Nom du produit<input id="pName" required></label>
      <label>Prix (FCFA)<input id="pPrice" type="number" min="0" required></label>
      <label>Catégorie<select id="pCategory" required><option>Mode</option><option>Électronique</option><option>Maison</option><option>Parfums</option><option>Alimentation</option><option>Autres</option></select></label>
      <label>Stock<input id="pStock" type="number" min="0" value="1" required></label>
      <label class="span-2">Image (URL, facultatif)<input id="pImage" type="url" placeholder="https://…"></label>
      <label class="span-2">Description<textarea id="pDescription" rows="3"></textarea></label>
      <button class="btn primary span-2" type="submit">Publier le produit</button>
      <p id="sellerMessage" class="message span-2"></p>
    </form>
    <h3>Mes produits</h3>
    <div id="sellerProducts" class="seller-products"></div>
  </div>
</div>

<div class="modal hidden" id="cartModal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <button class="close" data-close="cartModal">×</button>
    <h2>Mon panier</h2>
    <div id="cartItems"></div>
    <div class="cart-total"><span>Total</span><strong id="cartTotal">0 FCFA</strong></div>
    <button id="orderBtn" class="btn primary full">Passer la commande</button>
    <p id="cartMessage" class="message"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=1"></script>
</body>
</html>
